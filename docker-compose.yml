version: '3.8'

services:
  api:
    build: .
    command: python -m api.main
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=community-key-123
    depends_on:
      - redis

  dashboard:
    build: .
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - API_KEY=community-key-123
    depends_on:
      - api

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
